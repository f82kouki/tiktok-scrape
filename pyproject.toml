[project]
name = "tiktok-scraping"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.2",
    "scrapling[fetchers]>=0.3.13",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
# リポジトリルートを import パスに入れ、`from src...` を解決可能にする
# （これが無いと `uv run pytest` が ModuleNotFoundError: No module named 'src' で落ちる）
pythonpath = ["."]
